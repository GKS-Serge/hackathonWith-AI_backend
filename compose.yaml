# ==============================================================================
# SCHOLARSHIP / ACADÉMIE - Docker Compose Configuration
# 3 Services : backend (Laravel/PHP-FPM), nginx (Reverse Proxy), postgres (PostgreSQL 18)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. API Backend (Laravel 12 + PHP 8.3-FPM)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWUSER: 1000
        WWWGROUP: 1000
    container_name: scholarship_backend
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    volumes:
      # Montage du code source pour développement dynamique sous Windows
      - .:/var/www/html
      # Volume isolé pour vendor afin d'éviter tout conflit de compilation ou masquage Windows
      - backend_vendor:/var/www/html/vendor
    networks:
      - scholarship_net
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Serveur Web Nginx (Exposition de l'API sur le port 8000)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: scholarship_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scholarship_net
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # 3. Base de Données PostgreSQL 18 (Alpine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: scholarship_postgres
    restart: unless-stopped
    environment:
      # Compte administrateur natif PostgreSQL (obligatoire dans .env.docker, échec Compose si absent)
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER doit être défini dans .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD doit être défini dans .env.docker}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      # Variables applicatives requises transmises dynamiquement à docker/postgres/init-user.sh (échec Compose si absentes)
      APP_DB_NAME: ${DB_DATABASE:?DB_DATABASE doit être défini dans .env.docker}
      APP_DB_USER: ${DB_USERNAME:?DB_USERNAME doit être défini dans .env.docker}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env.docker}
    volumes:
      # Persistance absolue des données PostgreSQL conteneurisées
      - scholarship_pgdata:/var/lib/postgresql/data
      # Script d'initialisation shell du rôle applicatif restreint et de la base dédiée
      - ./docker/postgres/init-user.sh:/docker-entrypoint-initdb.d/01-init-user.sh:ro
    ports:
      # Port 5433 sur l'hôte Windows pour ne pas entrer en conflit avec le 5432 local
      - "5433:5432"
    networks:
      - scholarship_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

# ------------------------------------------------------------------------------
# Réseau privé interne et Volumes persistants
# ------------------------------------------------------------------------------
networks:
  scholarship_net:
    driver: bridge

volumes:
  scholarship_pgdata:
    driver: local
  backend_vendor:
    driver: local
